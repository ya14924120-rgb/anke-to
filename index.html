<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="アンケート">
<title>アンケート</title>
<style>
  :root{
    --bg:#f5f7fa; --card:#fff; --text:#1f2933; --sub:#616e7c;
    --primary:#1565c0; --primary-dark:#0d47a1; --sel:#e3f0ff;
    --border:#cbd2d9; --danger:#c62828; --ok:#2e7d32;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    background:var(--bg); color:var(--text);
    touch-action:manipulation; -webkit-user-select:none; user-select:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .screen{display:none; min-height:100vh; padding:20px 4vw 20px; flex-direction:column;}
  #survey{height:100vh; height:100dvh; min-height:0;}
  .screen.active{display:flex;}

  /* 回答画面 */
  .top{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .qno{display:inline-block; background:var(--primary); color:#fff; font-weight:700; font-size:clamp(20px,2.4vw,26px); padding:6px 18px; border-radius:999px;}
  .steps{display:flex; gap:10px;}
  .steps span{width:16px; height:16px; border-radius:50%; background:#cfd8dc;}
  .steps span.on{background:var(--primary);}
  #question{font-size:clamp(26px,3.4vw,38px); font-weight:700; line-height:1.35; margin:10px 0 2px;}
  #hint{color:var(--sub); font-size:clamp(17px,2vw,21px); margin:0 0 12px;}
  #options{
    display:grid; gap:12px; flex:1; min-height:0;
    grid-template-columns:1fr 1fr; grid-auto-flow:column;
    align-content:stretch;
  }
  .opt{
    font:inherit; background:var(--card); color:var(--text);
    border:3px solid var(--border); border-radius:16px;
    padding:8px 16px; min-height:0; cursor:pointer;
    display:flex; align-items:center; gap:16px; text-align:left;
    transition:background .12s, border-color .12s, transform .08s;
  }
  .opt:active{transform:scale(.98);}
  .opt .no{flex:0 0 auto; width:46px; height:46px; border-radius:50%; background:#eceff1; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:700;}
  .opt .body{flex:1; display:flex; align-items:center; gap:12px; min-width:0;}
  .opt img{display:block; height:min(62px,6.5vh); width:auto; max-width:100%; border-radius:6px;}
  .opt img.small{height:min(46px,5vh);}
  .opt .label{font-size:clamp(21px,2.6vw,28px); font-weight:700; line-height:1.3;}
  .opt .label small{display:block; font-size:.72em; font-weight:600;}
  .opt.selected{background:var(--sel); border-color:var(--primary); box-shadow:0 0 0 2px var(--primary) inset;}
  .opt.selected .no{background:var(--primary); color:#fff;}
  .nav{display:flex; gap:16px; justify-content:center; margin-top:16px; flex:0 0 auto;}
  .nav button{
    font:inherit; font-size:clamp(24px,3vw,32px); font-weight:700;
    padding:18px 0; border-radius:999px; cursor:pointer; width:min(44%,380px);
  }
  #btnPrev{background:#fff; color:var(--primary); border:3px solid var(--primary);}
  #btnNext{background:var(--primary); color:#fff; border:3px solid var(--primary);}
  #btnNext:disabled{background:#b0bec5; border-color:#b0bec5; cursor:default;}
  #btnNext:not(:disabled):active{background:var(--primary-dark);}

  /* お礼 */
  #thanks{position:fixed; inset:0; background:rgba(255,255,255,.97); display:none; flex-direction:column; align-items:center; justify-content:center; z-index:50; text-align:center; padding:24px;}
  #thanks.show{display:flex;}
  #thanks .big{font-size:110px; color:var(--ok); line-height:1;}
  #thanks .msg{font-size:clamp(32px,4.4vw,48px); font-weight:700; margin-top:24px;}

  /* 管理者入口（左上の見えない領域） */
  #adminHot{position:fixed; top:0; left:0; width:80px; height:80px; z-index:40;}

  /* 管理画面 */
  #admin{background:#eef1f5; padding:40px 5vw; -webkit-user-select:text; user-select:text;}
  #admin h1{margin:0 0 24px; font-size:30px;}
  .panel{background:var(--card); border-radius:16px; padding:24px; margin-bottom:20px; box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .panel h2{margin:0 0 16px; font-size:22px;}
  .panel h3{margin:22px 0 8px; font-size:19px;}
  .row{display:flex; gap:12px; flex-wrap:wrap;}
  .btn{font:inherit; font-size:20px; font-weight:600; padding:16px 26px; border-radius:12px; border:2px solid var(--primary); background:var(--primary); color:#fff; cursor:pointer;}
  .btn.sec{background:#fff; color:var(--primary);}
  .btn.danger{background:#fff; color:var(--danger); border-color:var(--danger);}
  label{display:block; font-weight:600; margin:0 0 6px; font-size:18px;}
  input[type=password],textarea{width:100%; font:inherit; font-size:20px; padding:12px 14px; border:2px solid var(--border); border-radius:10px; -webkit-user-select:text; user-select:text;}
  .note{color:var(--sub); font-size:16px; margin:8px 0 0;}
  table{width:100%; border-collapse:collapse; font-size:18px;}
  th,td{padding:8px 6px; border-bottom:1px solid #e4e7eb; text-align:left;}
  td.num{text-align:right; font-variant-numeric:tabular-nums; width:90px;}
  .bar{height:12px; background:var(--primary); border-radius:6px; min-width:2px;}
  #csvBox{display:none; margin-top:16px;}
  #csvBox textarea{font-family:Menlo,monospace; font-size:14px; min-height:200px;}
  .warn{background:#fff3e0; color:#8a4b00; padding:12px 16px; border-radius:10px; margin-bottom:16px; display:none;}

  /* 自作ダイアログ */
  #dlg{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:100; padding:24px;}
  #dlg.show{display:flex;}
  #dlg .box{background:#fff; border-radius:18px; padding:28px; width:min(100%,520px);}
  #dlgMsg{font-size:22px; line-height:1.6; margin:0 0 18px; white-space:pre-line;}
  #dlgInput{margin-bottom:18px;}
  #dlg .row{justify-content:flex-end;}
  #toast{position:fixed; left:50%; bottom:40px; transform:translateX(-50%); background:#263238; color:#fff; padding:14px 26px; border-radius:999px; font-size:18px; display:none; z-index:120;}
</style>
</head>
<body>

<!-- 回答画面 -->
<section id="survey" class="screen active">
  <div class="top">
    <span class="qno" id="qno"></span>
    <div class="steps" id="steps"></div>
  </div>
  <h1 id="question"></h1>
  <p id="hint">あてはまるものを1つ選んでください</p>
  <div id="options"></div>
  <div class="nav">
    <button id="btnPrev" type="button">戻る</button>
    <button id="btnNext" type="button" disabled>次へ</button>
  </div>
</section>
<div id="adminHot" aria-hidden="true"></div>

<div id="thanks">
  <div class="big">✓</div>
  <div class="msg">ご協力ありがとうございました</div>
</div>

<!-- 管理画面 -->
<section id="admin" class="screen">
  <h1>管理画面</h1>
  <div id="storageWarn" class="warn">この端末ではデータを保存できない設定になっています。ページを閉じると回答が消えるため、こまめにCSV出力してください（Safariのプライベートモードを解除すると保存できます）。</div>

  <div class="panel">
    <h2>集計（回答数 <span id="total">0</span> 件）</h2>
    <div id="summary"></div>
  </div>

  <div class="panel">
    <h2>CSV出力</h2>
    <div class="row">
      <button class="btn" id="btnDownload">CSVを保存</button>
      <button class="btn sec" id="btnShare">共有（AirDrop・メール等）</button>
      <button class="btn sec" id="btnShowCsv">CSVを表示してコピー</button>
    </div>
    <p class="note">「CSVを保存」は「ファイル」アプリのダウンロードに保存されます。1行が1人分の回答で、Excelで文字化けしない形式（UTF-8 BOM付き）です。</p>
    <div id="csvBox">
      <textarea id="csvText" readonly></textarea>
      <div class="row" style="margin-top:10px"><button class="btn sec" id="btnCopy">コピー</button></div>
    </div>
  </div>

  <div class="panel">
    <h2>暗証番号の変更</h2>
    <label for="cfgPin">新しい暗証番号</label>
    <input type="password" id="cfgPin" inputmode="numeric">
    <div class="row" style="margin-top:14px"><button class="btn" id="btnSavePin">変更する</button></div>
  </div>

  <div class="panel">
    <h2>データの削除</h2>
    <p class="note" style="margin:0 0 14px">削除すると元に戻せません。先にCSVを出力してください。</p>
    <button class="btn danger" id="btnClear">全回答を削除</button>
  </div>

  <div class="row"><button class="btn" id="btnBack" style="font-size:24px;padding:20px 40px">回答画面に戻る</button></div>
</section>

<div id="dlg"><div class="box">
  <p id="dlgMsg"></p>
  <input type="password" id="dlgInput" inputmode="numeric">
  <div class="row">
    <button class="btn sec" id="dlgCancel">キャンセル</button>
    <button class="btn" id="dlgOk">OK</button>
  </div>
</div></div>
<div id="toast"></div>

  var QUESTIONS = [
    { title: "Q1", text: "いつも、情報を、どこから手に入れていますか？", options: [
      { label: "X(Twitter)", img: IMG.x },
      { label: "Instagram", img: IMG.ig },
      { label: "YouTube", img: IMG.yt },
      { label: "LINE公式アカウント", img: IMG.line },
      { label: "Facebook", img: IMG.fb },
      { label: "ほかのSNS", text: "ほかのＳＮＳ" },
      { label: "テレビ、ニュースApp", text: "テレビ、ニュースApp" },
      { label: "家族、友人", text: "家族、友人" },
      { label: "職場、仕事仲間", text: "職場、仕事仲間" },
      { label: "そのほか", text: "そのほか" }
    ]},
    { title: "Q2", text: "結城市からの情報は、どこで発信してほしいですか？", options: [
      { label: "X(Twitter)", img: IMG.x },
      { label: "Instagram", img: IMG.ig },
      { label: "YouTube", img: IMG.yt },
      { label: "LINE公式アカウント", img: IMG.line },
      { label: "Facebook", img: IMG.fb },
      { label: "公式ウェブサイト", img: IMG.yuki, imgSmall: true, text: "公式ウェブサイト" },
      { label: "広報結城 お知らせ版", html: "広報結城　お知らせ版<small>News letter</small>" },
      { label: "そのほか", text: "そのほか" }
    ]}
  ];
  var IDLE_RESET_MS = 60000; // 途中で60秒操作がなければ最初に戻す
  var THANKS_MS = 2500;
  var KEY_PIN = "yuki_survey2q_pin", KEY_DATA = "yuki_survey2q_answers";

  // ===== 保存（使えない端末ではメモリに保持） =====
  var mem = {}, storageOK = true;
  try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); }catch(e){ storageOK = false; }
  function load(k, def){
    if(!storageOK) return (k in mem) ? mem[k] : def;
    try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(e){ return def; }
  }
  function save(k, v){
    mem[k] = v;
    if(storageOK){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ storageOK = false; } }
  }

  var pin = load(KEY_PIN, "0000");
  var answers = load(KEY_DATA, []);
  var step = 0, picks = [];
  var $ = function(id){ return document.getElementById(id); };

  // ===== 回答画面 =====
  function renderStep(){
    var q = QUESTIONS[step];
    $("qno").textContent = q.title;
    $("question").textContent = q.text;
    var st = $("steps"); st.innerHTML = "";
    QUESTIONS.forEach(function(_, i){ var s = document.createElement("span"); if(i <= step) s.className = "on"; st.appendChild(s); });

    var box = $("options"); box.innerHTML = "";
    box.style.gridTemplateRows = "repeat(" + Math.ceil(q.options.length / 2) + ", minmax(64px, 1fr))";
    q.options.forEach(function(o, i){
      var b = document.createElement("button");
      b.type = "button"; b.className = "opt" + (picks[step] === i ? " selected" : "");
      b.setAttribute("aria-label", (i+1) + " " + o.label);
      var no = document.createElement("span"); no.className = "no"; no.textContent = i + 1;
      var body = document.createElement("span"); body.className = "body";
      if(o.img){ var im = document.createElement("img"); im.src = o.img; im.alt = o.label; if(o.imgSmall) im.className = "small"; body.appendChild(im); }
      if(o.text || o.html){
        var lb = document.createElement("span"); lb.className = "label";
        if(o.html) lb.innerHTML = o.html; else lb.textContent = o.text;
        body.appendChild(lb);
      }
      b.appendChild(no); b.appendChild(body);
      b.addEventListener("click", function(){
        picks[step] = i;
        Array.prototype.forEach.call(box.children, function(c, j){ c.classList.toggle("selected", j === i); });
        $("btnNext").disabled = false;
        touchIdle();
      });
      box.appendChild(b);
    });
    $("btnPrev").style.display = step === 0 ? "none" : "";
    $("btnNext").textContent = step === QUESTIONS.length - 1 ? "送信" : "次へ";
    $("btnNext").disabled = picks[step] === undefined;
    window.scrollTo(0, 0);
  }

  $("btnNext").addEventListener("click", function(){
    if(picks[step] === undefined) return;
    if(step < QUESTIONS.length - 1){ step++; renderStep(); touchIdle(); return; }
    // 送信
    var rec = { t: fmtDate(new Date()), a: picks.slice() };
    answers.push(rec);
    save(KEY_DATA, answers);
    clearTimeout(idleTimer);
    $("thanks").classList.add("show");
    setTimeout(function(){ $("thanks").classList.remove("show"); resetSurvey(); }, THANKS_MS);
  });
  $("btnPrev").addEventListener("click", function(){ if(step > 0){ step--; renderStep(); touchIdle(); } });

  function resetSurvey(){ step = 0; picks = []; renderStep(); }

  var idleTimer = null;
  function touchIdle(){
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function(){
      if($("survey").classList.contains("active") && (step > 0 || picks.length)) resetSurvey();
    }, IDLE_RESET_MS);
  }

  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function fmtDate(d){
    return d.getFullYear() + "/" + pad(d.getMonth()+1) + "/" + pad(d.getDate()) + " " +
           pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  }

  // ===== 管理画面への入口：左上を5回連続タップ =====
  var taps = 0, tapTimer = null;
  $("adminHot").addEventListener("click", function(){
    taps++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(function(){ taps = 0; }, 2000);
    if(taps >= 5){
      taps = 0;
      ask("暗証番号を入力してください", function(v){
        if(v === pin) openAdmin(); else toast("暗証番号が違います");
      });
    }
  });

  function openAdmin(){
    clearTimeout(idleTimer);
    $("survey").classList.remove("active");
    $("adminHot").style.display = "none";
    $("admin").classList.add("active");
    $("storageWarn").style.display = storageOK ? "none" : "block";
    $("cfgPin").value = "";
    $("csvBox").style.display = "none";
    renderSummary();
    window.scrollTo(0, 0);
  }
  $("btnBack").addEventListener("click", function(){
    $("admin").classList.remove("active");
    $("survey").classList.add("active");
    $("adminHot").style.display = "block";
    resetSurvey();
  });

  function renderSummary(){
    $("total").textContent = answers.length;
    var wrap = $("summary"); wrap.innerHTML = "";
    QUESTIONS.forEach(function(q, qi){
      var h = document.createElement("h3"); h.textContent = q.title + "　" + q.text; wrap.appendChild(h);
      var counts = q.options.map(function(){ return 0; });
      answers.forEach(function(r){ var k = r.a[qi]; if(k !== undefined && k < counts.length) counts[k]++; });
      var max = Math.max.apply(null, counts.concat([1]));
      var tb = document.createElement("table");
      tb.innerHTML = "<tr><th>選択肢</th><th></th><th style='text-align:right'>件数</th><th style='text-align:right'>割合</th></tr>";
      q.options.forEach(function(o, i){
        var tr = document.createElement("tr");
        tr.innerHTML = "<td></td><td style='width:32%'><div class='bar'></div></td><td class='num'></td><td class='num'></td>";
        tr.children[0].textContent = (i+1) + ". " + o.label;
        tr.querySelector(".bar").style.width = (counts[i] / max * 100) + "%";
        tr.children[2].textContent = counts[i];
        tr.children[3].textContent = answers.length ? (counts[i] / answers.length * 100).toFixed(1) + "%" : "-";
        tb.appendChild(tr);
      });
      wrap.appendChild(tb);
    });
  }

  // ===== CSV（1行＝1人分） =====
  function csvEscape(s){ s = String(s); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  function buildCsv(){
    var head = ["番号", "回答日時"];
    QUESTIONS.forEach(function(q){ head.push(q.title + "_番号", q.title + "_回答"); });
    var lines = [head.join(",")];
    answers.forEach(function(r, i){
      var row = [i + 1, r.t];
      QUESTIONS.forEach(function(q, qi){
        var k = r.a[qi];
        row.push(k === undefined ? "" : k + 1, k === undefined ? "" : q.options[k].label);
      });
      lines.push(row.map(csvEscape).join(","));
    });
    return lines.join("\r\n") + "\r\n";
  }
  function csvName(){
    var d = new Date();
    return "アンケート結果_" + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + "_" + pad(d.getHours()) + pad(d.getMinutes()) + ".csv";
  }
  function csvBlob(){ return new Blob(["﻿" + buildCsv()], { type: "text/csv;charset=utf-8" }); }

  $("btnDownload").addEventListener("click", function(){
    if(!answers.length){ toast("回答がまだありません"); return; }
    try{
      var url = URL.createObjectURL(csvBlob());
      var a = document.createElement("a");
      a.href = url; a.download = csvName();
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
    }catch(e){ showCsv(); toast("保存できないため表示しました。コピーしてお使いください"); }
  });
  $("btnShare").addEventListener("click", function(){
    if(!answers.length){ toast("回答がまだありません"); return; }
    try{
      var file = new File([csvBlob()], csvName(), { type: "text/csv" });
      if(navigator.canShare && navigator.canShare({ files: [file] })){
        navigator.share({ files: [file], title: "アンケート結果" }).catch(function(){});
        return;
      }
    }catch(e){}
    toast("この環境では共有できません。「CSVを保存」をお使いください");
  });
  function showCsv(){ $("csvText").value = buildCsv(); $("csvBox").style.display = "block"; }
  $("btnShowCsv").addEventListener("click", showCsv);
  $("btnCopy").addEventListener("click", function(){
    var t = $("csvText").value;
    var done = function(){ toast("コピーしました"); };
    function fallbackCopy(){
      var ta = $("csvText"); ta.removeAttribute("readonly"); ta.select(); ta.setSelectionRange(0, t.length);
      try{ document.execCommand("copy"); done(); }catch(e){ toast("全選択してコピーしてください"); }
      ta.setAttribute("readonly", "");
    }
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, fallbackCopy);
    else fallbackCopy();
  });

  $("btnSavePin").addEventListener("click", function(){
    var v = $("cfgPin").value.trim();
    if(!v){ toast("暗証番号を入力してください"); return; }
    pin = v; save(KEY_PIN, pin); $("cfgPin").value = ""; toast("暗証番号を変更しました");
  });
  $("btnClear").addEventListener("click", function(){
    if(!answers.length){ toast("削除する回答はありません"); return; }
    ask("全 " + answers.length + " 件の回答を削除します。\n確認のため暗証番号を入力してください。", function(v){
      if(v !== pin){ toast("暗証番号が違います"); return; }
      answers = []; save(KEY_DATA, answers); renderSummary(); $("csvBox").style.display = "none";
      toast("削除しました");
    });
  });

  // ===== ダイアログ・トースト =====
  var dlgCb = null;
  function ask(msg, cb){
    $("dlgMsg").textContent = msg; $("dlgInput").value = ""; dlgCb = cb;
    $("dlg").classList.add("show");
    setTimeout(function(){ $("dlgInput").focus(); }, 50);
  }
  function closeDlg(){ $("dlg").classList.remove("show"); $("dlgInput").blur(); }
  $("dlgCancel").addEventListener("click", function(){ closeDlg(); dlgCb = null; });
  $("dlgOk").addEventListener("click", function(){ var cb = dlgCb, v = $("dlgInput").value; closeDlg(); dlgCb = null; if(cb) cb(v); });
  $("dlgInput").addEventListener("keydown", function(e){ if(e.key === "Enter") $("dlgOk").click(); });
  var toastTimer = null;
  function toast(msg){
    var t = $("toast"); t.textContent = msg; t.style.display = "block";
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.style.display = "none"; }, 2500);
  }

  // ダブルタップ拡大の防止
  var lastTouch = 0;
  document.addEventListener("touchend", function(e){
    var now = Date.now();
    if(now - lastTouch < 350 && !e.target.closest("input,textarea")) e.preventDefault();
    lastTouch = now;
  }, { passive: false });

  renderStep();
})();
</script>
</body>
</html>
